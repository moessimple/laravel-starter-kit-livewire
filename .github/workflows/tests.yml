name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # composer test:unit: the Pest Arch/Unit/Http suite under a 100% line-coverage gate.
    # Lint, static analysis and type coverage are their own workflows so a formatting nit
    # and a real failure are separate red checks.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          coverage: xdebug

      - name: App tests
        run: composer test:unit

  browser:
    # Real-browser tests via pest-plugin-browser + headless Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app

      - name: Prepare the SQLite database
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        # A cache hit skips the browser download; --with-deps still installs the
        # apt libraries, which the cache cannot hold.
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        # No --retry: a browser test that only passes on a re-run is a defect to fix or delete.
        run: composer test:browser

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore
          retention-days: 7
