name: Setup app
description: PHP 8.5, Node, Composer + npm dependencies and environment.

inputs:
  coverage:
    description: PHP coverage driver (none or xdebug).
    default: none
  build:
    description: >-
      'true' runs `npm run build` (a full Vite build, needed whenever a Blade view renders @vite).
      'false' skips it for jobs that never render a view.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: '8.5'
        tools: composer:2.11.1@sha256:6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c
        coverage: ${{ inputs.coverage }}

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      # Caches the download cache, not vendor/: Composer loads plugins from an existing vendor/
      # before installing, so a stale vendor/ from restore-keys runs outdated plugin code.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

    - name: Prepare environment
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Cache npm dependencies
      # Caches npm's download cache, not node_modules/: npm keeps installed packages that still
      # satisfy package.json, so a restored node_modules/ would hold back newer releases.
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'package-lock.json') }}
        restore-keys: ${{ runner.os }}-npm-

    - name: Install npm dependencies
      # npm ci installs exactly what package-lock.json records and fails if it is out of sync with
      # package.json. Without a committed package-lock.json, npm install resolves the dependencies.
      shell: bash
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    - name: Build assets
      if: inputs.build == 'true'
      shell: bash
      run: npm run build
